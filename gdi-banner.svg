<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#1084d0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="290"/></clipPath>

    <!-- one classic error dialog, 300x120 -->
    <g id="dlg" font-family="Arial, Helvetica, sans-serif">
      <rect width="300" height="122" fill="#c0c0c0" stroke="#000"/>
      <path d="M1 119 V1 H299" fill="none" stroke="#fff" stroke-width="2"/>
      <path d="M299 1 V119 H1" fill="none" stroke="#808080" stroke-width="2"/>

      <!-- title bar -->
      <rect x="4" y="4" width="292" height="18" fill="url(#title)"/>
      <text x="9" y="17" font-size="12" font-weight="bold" fill="#fff">acesoftridev101virus.exe</text>
      <rect x="277" y="6" width="16" height="14" fill="#c0c0c0" stroke="#000" stroke-width="0.5"/>
      <path d="M281 9 L289 17 M289 9 L281 17" stroke="#000" stroke-width="1.5"/>

      <!-- icon -->
      <circle cx="34" cy="6" r="16" fill="#e00000" stroke="#600000" stroke-width="1.5"/>
      <path d="M27 53 L41 67 M41 53 L27 67" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

      <!-- message -->
      <text x="62" y="48" font-size="12" fill="#000">An error has occurred while</text>
      <text x="62" y="64" font-size="12" fill="#000">trying to display an error.</text>
      <text x="62" y="80" font-size="12" fill="#000">Please try again later.</text>

      <!-- OK button -->
      <rect x="110" y="92" width="80" height="22" fill="#c0c0c0" stroke="#000"/>
      <path d="M111 113 V93 H189" fill="none" stroke="#fff" stroke-width="1.5"/>
      <path d="M189 93 V113 H111" fill="none" stroke="#808080" stroke-width="1.5"/>
      <text x="150" y="107" font-size="12" text-anchor="middle" fill="#000">OK</text>
    </g>
  </defs>

  <g clip-path="url(#clip)">
    <!-- classic teal desktop -->
    <rect width="1000" height="290" fill="#008080"/>

    <!-- the smeared trail: each ghost pops in and never gets repainted -->
    <use href="#dlg" x="20" y="70" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.0375;1"/>
    </use>
    <use href="#dlg" x="75" y="104" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.1;1"/>
    </use>
    <use href="#dlg" x="130" y="126" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.1625;1"/>
    </use>
    <use href="#dlg" x="185" y="128" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.225;1"/>
    </use>
    <use href="#dlg" x="240" y="110" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.2875;1"/>
    </use>
    <use href="#dlg" x="295" y="79" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.35;1"/>
    </use>
    <use href="#dlg" x="350" y="44" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.4125;1"/>
    </use>
    <use href="#dlg" x="405" y="18" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.475;1"/>
    </use>
    <use href="#dlg" x="460" y="10" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.5375;1"/>
    </use>
    <use href="#dlg" x="515" y="24" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.6;1"/>
    </use>
    <use href="#dlg" x="570" y="53" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.6625;1"/>
    </use>
    <use href="#dlg" x="625" y="89" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.725;1"/>
    </use>

    <!-- taskbar -->
    <g font-family="Arial, Helvetica, sans-serif">
      <rect y="262" width="1000" height="28" fill="#c0c0c0"/>
      <path d="M0 263 H1000" stroke="#fff" stroke-width="2"/>
      <rect x="4" y="266" width="62" height="21" fill="#c0c0c0" stroke="#000" stroke-width="0.5"/>
      <text x="14" y="281" font-size="13" font-weight="bold" fill="#000">Start</text>
      <rect x="880" y="266" width="116" height="21" fill="#c0c0c0" stroke="#808080"/>
      <text x="938" y="281" font-size="12" text-anchor="middle" fill="#000">Not Responding</text>
    </g>
  </g>
</svg>
