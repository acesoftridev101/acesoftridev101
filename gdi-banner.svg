<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <clipPath id="clip"><rect width="1000" height="260"/></clipPath>

    <!-- warp + color cycle, the "GDI" look -->
    <filter id="gdi" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.01 0.04" numOctaves="2" result="noise">
        <animate attributeName="baseFrequency" dur="8s" repeatCount="indefinite"
                 values="0.01 0.04; 0.03 0.01; 0.01 0.04"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" result="warp"/>
      <feColorMatrix in="warp" type="hueRotate" values="0">
        <animate attributeName="values" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </feColorMatrix>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="#000"/>

    <!-- tunnel rings -->
    <g filter="url(#gdi)" transform="translate(500,130)" fill="none" stroke-width="6">
      <rect x="-500" y="-130" width="1000" height="260" stroke="#ff0044">
        <animateTransform attributeName="transform" type="scale" from="0.02" to="2" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="-500" y="-130" width="1000" height="260" stroke="#00ffcc">
        <animateTransform attributeName="transform" type="scale" from="0.02" to="2" dur="4s" begin="-1s" repeatCount="indefinite"/>
      </rect>
      <rect x="-500" y="-130" width="1000" height="260" stroke="#ffee00">
        <animateTransform attributeName="transform" type="scale" from="0.02" to="2" dur="4s" begin="-2s" repeatCount="indefinite"/>
      </rect>
      <rect x="-500" y="-130" width="1000" height="260" stroke="#4400ff">
        <animateTransform attributeName="transform" type="scale" from="0.02" to="2" dur="4s" begin="-3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- text sits on top, unfiltered, so nothing overlaps -->
    <text x="500" y="145" text-anchor="middle" font-family="monospace" font-size="48"
          font-weight="bold" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">
      acesoftridev101
    </text>
  </g>
</svg>
