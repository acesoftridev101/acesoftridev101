name: Update README Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          card: stats
          options: "username=acesoftridev101&show_icons=true&count_private=true&theme=tokyonight"
          path: profile/stats.svg

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          card: top-langs
          options: "username=acesoftridev101&layout=compact&theme=tokyonight"
          path: profile/top-langs.svg

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add profile/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update GitHub stats SVGs" && git push)
